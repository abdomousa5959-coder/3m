<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>abdomousa</title>
<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

<style>
:root{
    --primary-color:#00FC3C;
    --live-color:#e62e2e;
    --menu-bg:#282828;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Tajawal',sans-serif!important;
    -webkit-tap-highlight-color:transparent;
}

#player-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#video-wrapper{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    display:block;
}

#loading-spinner{
    width:52px;
    height:52px;
    border:5px solid rgba(255,255,255,.2);
    border-top-color:var(--primary-color);
    border-radius:50%;
    animation:spin .8s linear infinite;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:100;
}

@keyframes spin{
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

#error-overlay{
    position:absolute;
    z-index:100;
    inset:0;
    background:rgba(0,0,0,.92);
    color:#fff;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

#error-overlay i{
    width:48px;
    height:48px;
    margin-bottom:20px;
    color:var(--live-color);
}

#error-overlay h3{
    margin:5px 0 10px;
}

#error-overlay p{
    max-width:500px;
    line-height:1.8;
    color:#ccc;
}

#error-overlay button{
    border:0;
    background:var(--primary-color);
    color:#000;
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    padding:11px 24px;
    border-radius:8px;
    cursor:pointer;
    margin-top:8px;
    min-width:150px;
}
#error-overlay button:active{
    transform:scale(.97);
}

/* التحكم */
.controls-overlay{
    position:absolute;
    z-index:10;
    transition:opacity .2s,visibility .2s;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.controls-overlay.visible{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

#bottom-controls-container{
    bottom:0;
    left:0;
    right:0;
    padding:5px 15px 12px;
    background:linear-gradient(to top,rgba(0,0,0,.92),transparent);
}

#center-controls{
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.center-controls-cluster{
    display:flex;
    align-items:center;
    gap:40px;
    background:rgba(0,0,0,.25);
    padding:10px 20px;
    border-radius:50px;
}

.control-button,
.center-control-button{
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
    padding:0;
    outline:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease,color .15s ease;
}

.control-button:hover,
.center-control-button:hover{
    color:var(--primary-color);
    transform:scale(1.08);
}

.control-button i,
.control-button svg{
    width:24px;
    height:24px;
}

.center-control-button i,
.center-control-button svg{
    width:42px;
    height:42px;
}

.center-seek-button i,
.center-seek-button svg{
    width:32px;
    height:32px;
}

/* شريط التحريك */
.progress-bar-container{
    width:100%;
    padding:10px 0;
}

.progress-bar{
    appearance:none;
    -webkit-appearance:none;
    display:block;
    width:100%;
    height:5px;
    margin:0;
    padding:0;
    background:rgba(255,255,255,.3);
    border-radius:4px;
    cursor:pointer;
    direction:ltr;
    accent-color:var(--primary-color);
}

.progress-bar::-webkit-slider-runnable-track{
    height:5px;
    background:rgba(255,255,255,.3);
    border-radius:4px;
}

.progress-bar::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:13px;
    height:13px;
    margin-top:-4px;
    border:0;
    border-radius:50%;
    background:var(--primary-color);
}

.progress-bar::-moz-range-track{
    height:5px;
    background:rgba(255,255,255,.3);
    border-radius:4px;
}

.progress-bar::-moz-range-progress{
    height:5px;
    background:var(--primary-color);
    border-radius:4px;
}

.progress-bar::-moz-range-thumb{
    width:13px;
    height:13px;
    border:0;
    border-radius:50%;
    background:var(--primary-color);
}

.bottom-controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
}

.controls-left,
.controls-right{
    display:flex;
    align-items:center;
    gap:15px;
}

#time-display-container{
    color:#fff;
    font-size:.9em;
    font-weight:500;
    min-width:100px;
    text-align:center;
}

/* الإعدادات */
#settings-popup{
    position:absolute;
    bottom:80px;
    width:260px;
    background:var(--menu-bg);
    border-radius:8px;
    z-index:20;
    display:none;
    box-shadow:0 0 20px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.1);
}

#settings-list{
    list-style:none;
    padding:8px;
    margin:0;
    overflow-y:auto;
    max-height:220px;
}

.settings-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 12px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.settings-title{
    color:#ccc;
    font-weight:700;
}

.settings-close-btn,
.settings-back-btn{
    cursor:pointer;
    color:#ccc;
    padding:5px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    border-radius:5px;
    cursor:pointer;
    font-weight:500;
    color:#fff;
}

.menu-item:hover{
    background:rgba(255,255,255,.1);
}

.menu-item.active{
    color:var(--primary-color);
    font-weight:700;
}

.menu-item .checkmark{
    width:20px;
    height:20px;
    visibility:hidden;
}

.menu-item.active .checkmark{
    visibility:visible;
}

.menu-item-value{
    font-size:.9em;
    color:#aaa;
    margin-right:auto;
}
@media(max-width:600px){
    .center-controls-cluster{
        gap:25px;
        padding:8px 16px;
    }

    .center-control-button i,
    .center-control-button svg{
        width:38px;
        height:38px;
    }

    #player-logo{
        height:45px;
        bottom:60px;
    }

    #telegram-link{
        top:12px;
        right:12px;
    }

    .controls-left,
    .controls-right{
        gap:12px;
    }

    #time-display-container{
        min-width:90px;
        font-size:.82em;
    }
}
</style>
</head>

<body>

<div id="player-container">

    <div id="loading-spinner"></div>

    <div id="error-overlay">
        <i data-feather="alert-triangle"></i>
        <h3 id="error-title">فشل تحميل الفيديو</h3>
        <p id="error-message">
            تعذر تشغيل الفيديو. سيتم إعادة المحاولة تلقائياً.
        </p>
        <button id="retry-btn" type="button">إعادة المحاولة</button>
    </div>

    <div id="video-wrapper">
        <video
            id="video"
            autoplay
            playsinline
            webkit-playsinline
            preload="auto"
            controlslist="nodownload noplaybackrate"
            disablepictureinpicture>
        </video>
    </div>

    <div id="settings-popup">

        <div class="settings-header">

            <span class="settings-back-btn" style="display:none;">
                <i data-feather="arrow-right"></i>
            </span>

            <span class="settings-title">
                الإعدادات
            </span>

            <span class="settings-close-btn">
                <i data-feather="x"></i>
            </span>

        </div>

        <ul id="settings-list"></ul>

    </div>

    <div id="center-controls" class="controls-overlay">

        <div class="center-controls-cluster">

            <button
                class="control-button center-seek-button"
                id="seek-forward-btn"
                title="تقديم 10 ثواني">
                <i data-feather="fast-forward"></i>
            </button>

            <button
                class="center-control-button"
                id="play-pause-center-btn"
                title="تشغيل/إيقاف">
                <i data-feather="play"></i>
            </button>

            <button
                class="control-button center-seek-button"
                id="seek-backward-btn"
                title="رجوع 10 ثواني">
                <i data-feather="rewind"></i>
            </button>

        </div>

    </div>

    <div id="bottom-controls-container" class="controls-overlay">

        <div class="progress-bar-container">
            <input
                type="range"
                id="seek-bar"
                min="0"
                max="0"
                value="0"
                step="0.1"
                class="progress-bar">
        </div>

        <div class="bottom-controls">

            <div class="controls-left">

                <button
                    class="control-button"
                    id="fullscreen-btn"
                    title="ملء الشاشة">
                    <i data-feather="maximize"></i>
                </button>

                <button
                    id="settings-btn"
                    class="control-button"
                    title="الإعدادات">
                    <i data-feather="settings"></i>
                </button>

                <button
                    class="control-button"
                    id="expand-btn"
                    title="تغيير وضع العرض">
                </button>

            </div>

            <div class="controls-right">

                <div id="time-display-container">
                    <span id="time-display">00:00 / 00:00</span>
                </div>

                <button
                    class="control-button"
                    id="mute-btn"
                    title="كتم الصوت">
                    <i data-feather="volume-2"></i>
                </button>

                <button
                    class="control-button"
                    id="play-pause-btn"
                    title="تشغيل/إيقاف">
                    <i data-feather="play"></i>
                </button>

            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    feather.replace();

    /* =====================================================
       رابط الفيديو
       ===================================================== */

    const STREAM_URL =
    "https://b2.shahidtv.net/files/Movies/hollywood/Spider-Man-Brand-New-Day-2026/Spider-Man-Brand-New-Day-2026-hdts-720p.mp4";


    /* =====================================================
       العناصر
       ===================================================== */

    const video =
        document.getElementById("video");

    const container =
        document.getElementById("player-container");

    const loading =
        document.getElementById("loading-spinner");

    const errorOverlay =
        document.getElementById("error-overlay");

    const errorTitle =
        document.getElementById("error-title");

    const errorMessage =
        document.getElementById("error-message");

    const retryBtn =
        document.getElementById("retry-btn");

    const centerControls =
        document.getElementById("center-controls");

    const bottomControls =
        document.getElementById("bottom-controls-container");

    const playBtn =
        document.getElementById("play-pause-btn");

    const centerPlayBtn =
        document.getElementById("play-pause-center-btn");

    const muteBtn =
        document.getElementById("mute-btn");

    const fullscreenBtn =
        document.getElementById("fullscreen-btn");

    const expandBtn =
        document.getElementById("expand-btn");

    const settingsBtn =
        document.getElementById("settings-btn");

    const settingsPopup =
        document.getElementById("settings-popup");

    const seekBar =
        document.getElementById("seek-bar");

    const timeDisplay =
        document.getElementById("time-display");


    /* =====================================================
       وضع العرض
       ===================================================== */

    const expandSvg = `
    <svg fill="currentColor"
         xmlns="http://www.w3.org/2000/svg"
         width="24"
         height="24"
         viewBox="0 0 100 100">

        <path d="M22 20h14c1 0 2-1 2-2s-1-2-2-2H19c-1 0-2 1-2 2v17c0 1 1 2 2 2s2-1 2-2V25l16 16c1 1 2 1 3 0s1-2 0-3L22 20z"/>

        <path d="M83 16H66c-1 0-2 1-2 2s1 2 2 2h13L62 37c-1 1-1 2 0 3s2 1 3 0l16-16v12c0 1 1 2 2 2s2-1 2-2V18c0-1-1-2-2-2z"/>

        <path d="M37 61L20 77V66c0-1-1-2-2-2s-2 1-2 2v17c0 1 1 2 2 2h17c1 0 2-1 2-2s-1-2-2-2H23l17-16c1-1 1-2 0-3s-2-1-3-1z"/>

        <path d="M83 64c-1 0-2 1-2 2v12L64 61c-1-1-2-1-3 0s-1 2 0 3l17 17H66c-1 0-2 1-2 2s1 2 2 2h17c1 0 2-1 2-2V66c0-1-1-2-2-2z"/>

    </svg>`;

    expandBtn.innerHTML = expandSvg;

    let expandIndex = 0;

    const expandModes = [
        "contain",
        "cover",
        "fill"
    ];


    /* =====================================================
       الأيقونات
       ===================================================== */

    function updatePlayIcon(){

        const icon =
            video.paused ? "play" : "pause";

        playBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        centerPlayBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();

    }


    function updateMuteIcon(){

        let icon;

        if(video.muted || video.volume === 0){
            icon = "volume-x";
        }
        else if(video.volume < .5){
            icon = "volume-1";
        }
        else{
            icon = "volume-2";
        }

        muteBtn.innerHTML =
            `<i data-feather="${icon}"></i>`;

        feather.replace();

    }


    function togglePlay(){

        if(video.paused){

            if(video.readyState === 0 || video.networkState === HTMLMediaElement.NETWORK_NO_SOURCE){
                startStream(true);
                return;
            }

            video.play().catch(function(error){
                console.log("Play error:", error);
                scheduleRetry();
            });

        }
        else{

            video.pause();

        }

    }


    /* =====================================================
       الوقت
       ===================================================== */

    function formatTime(seconds){

        if(!isFinite(seconds)){
            return "00:00";
        }

        seconds =
            Math.max(0,Math.floor(seconds));

        const hours =
            Math.floor(seconds / 3600);

        const minutes =
            Math.floor((seconds % 3600) / 60);

        const secs =
            seconds % 60;

        if(hours > 0){

            return String(hours).padStart(2,"0") +
                   ":" +
                   String(minutes).padStart(2,"0") +
                   ":" +
                   String(secs).padStart(2,"0");

        }

        return String(minutes).padStart(2,"0") +
               ":" +
               String(secs).padStart(2,"0");

    }


    function updateTimeDisplay(){

        const current =
            video.currentTime || 0;

        const duration =
            video.duration || 0;

        timeDisplay.textContent =
            formatTime(current) +
            " / " +
            formatTime(duration);

    }


    /* =====================================================
       شريط التحريك
       ===================================================== */

    let seeking = false;

    video.addEventListener(
        "loadedmetadata",
        function(){

            if(isFinite(video.duration)){

                seekBar.max =
                    video.duration;

                seekBar.value =
                    video.currentTime || 0;

            }

            updateTimeDisplay();

        }
    );


    video.addEventListener(
        "durationchange",
        function(){

            if(isFinite(video.duration)){

                seekBar.max =
                    video.duration;

            }

            updateTimeDisplay();

        }
    );


    video.addEventListener(
        "timeupdate",
        function(){

            if(!seeking){

                seekBar.value =
                    video.currentTime || 0;

                updateTimeDisplay();

            }

        }
    );


    seekBar.addEventListener(
        "pointerdown",
        function(){

            seeking = true;

        }
    );


    seekBar.addEventListener(
        "input",
        function(){

            if(isFinite(video.duration)){

                const value =
                    Number(seekBar.value);

                timeDisplay.textContent =
                    formatTime(value) +
                    " / " +
                    formatTime(video.duration);

            }

        }
    );


    seekBar.addEventListener(
        "change",
        function(){

            if(isFinite(video.duration)){

                video.currentTime =
                    Number(seekBar.value);

            }

            seeking = false;

        }
    );


    seekBar.addEventListener(
        "pointerup",
        function(){

            if(isFinite(video.duration)){

                video.currentTime =
                    Number(seekBar.value);

            }

            seeking = false;

        }
    );


    /* =====================================================
       Fullscreen
       ===================================================== */

    async function fullscreen(){

        try{

            if(!document.fullscreenElement){

                if(container.requestFullscreen){

                    await container.requestFullscreen();

                }
                else if(video.webkitEnterFullscreen){

                    video.webkitEnterFullscreen();

                }

            }
            else{

                if(document.exitFullscreen){

                    await document.exitFullscreen();

                }

            }

        }
        catch(error){

            console.log(
                "Fullscreen error:",
                error
            );

        }

    }


    function updateFullscreenIcon(){

        fullscreenBtn.innerHTML =
        `<i data-feather="${
            document.fullscreenElement
            ? "minimize"
            : "maximize"
        }"></i>`;

        feather.replace();

    }


    /* =====================================================
       التحكم بالواجهة
       ===================================================== */

    let controlTimer;

    function showControls(){

        centerControls.classList.add("visible");
        bottomControls.classList.add("visible");

        clearTimeout(controlTimer);

        if(!video.paused){

            controlTimer =
                setTimeout(function(){

                    centerControls.classList.remove("visible");
                    bottomControls.classList.remove("visible");

                },4000);

        }

    }


    function hideControls(){

        if(
            settingsPopup.style.display === "block"
        ){

            return;

        }

        centerControls.classList.remove("visible");
        bottomControls.classList.remove("visible");

    }


    /* =====================================================
       تشغيل الفيديو MP4 مباشرة
       ===================================================== */

    let retryTimer = null;
    let retryCount = 0;
    let streamStarted = false;
    let lastGoodTime = 0;

    function startStream(manual = false){

        if(retryTimer){
            clearTimeout(retryTimer);
            retryTimer = null;
        }

        if(manual){
            retryCount = 0;
        }

        loading.style.display = "block";
        errorOverlay.style.display = "none";

        try{
            video.pause();
            video.removeAttribute("src");
            video.load();
        }catch(e){}

        video.src = STREAM_URL;
        video.preload = "auto";
        video.load();

        const playPromise = video.play();

        if(playPromise && typeof playPromise.catch === "function"){
            playPromise.catch(function(error){
                console.log("Autoplay:", error);
                updatePlayIcon();
            });
        }
    }

    function scheduleRetry(){

        if(streamStarted || retryTimer){
            return;
        }

        retryCount++;
        const delay = Math.min(1000 * Math.pow(1.7, retryCount - 1), 8000);

        loading.style.display = "block";
        errorOverlay.style.display = "none";

        retryTimer = setTimeout(function(){
            retryTimer = null;
            startStream(false);
        }, delay);
    }


    /* =====================================================
       الأحداث
       ===================================================== */

    playBtn.onclick=function(e){

        e.stopPropagation();

        togglePlay();

    };


    centerPlayBtn.onclick=function(e){

        e.stopPropagation();

        togglePlay();

    };


    muteBtn.onclick=function(e){

        e.stopPropagation();

        video.muted =
            !video.muted;

        updateMuteIcon();

    };


    fullscreenBtn.onclick=function(e){

        e.stopPropagation();

        fullscreen();

    };


    expandBtn.onclick=function(e){

        e.stopPropagation();

        expandIndex =
            (expandIndex + 1) %
            expandModes.length;

        video.style.objectFit =
            expandModes[expandIndex];

    };


    document.addEventListener(
        "fullscreenchange",
        updateFullscreenIcon
    );


    video.addEventListener(
        "play",
        function(){

            updatePlayIcon();
            showControls();

        }
    );


    video.addEventListener(
        "pause",
        function(){

            updatePlayIcon();
            showControls();

        }
    );


    video.addEventListener(
        "volumechange",
        updateMuteIcon
    );


    video.addEventListener(
        "loadeddata",
        function(){

            loading.style.display = "none";

            updatePlayIcon();
            updateTimeDisplay();

            showControls();

        }
    );


    video.addEventListener(
        "canplay",
        function(){

            loading.style.display = "none";

            updatePlayIcon();

        }
    );


    video.addEventListener(
        "waiting",
        function(){

            loading.style.display = "block";

        }
    );


    video.addEventListener(
        "playing",
        function(){

            loading.style.display = "none";

        }
    );


    video.addEventListener(
        "ended",
        function(){

            loading.style.display = "none";

            updatePlayIcon();

            showControls();

        }
    );


    video.addEventListener(
        "error",
        function(){

            streamStarted = false;

            const mediaError = video.error;
            let message =
                "تعذر تشغيل الفيديو من الخادم. سيتم إعادة المحاولة تلقائياً.";

            if(mediaError){
                if(mediaError.code === 1){
                    message = "تم إيقاف تحميل الفيديو. اضغط إعادة المحاولة.";
                }
                else if(mediaError.code === 2){
                    message = "حدثت مشكلة في الاتصال بالخادم. سيتم إعادة المحاولة تلقائياً.";
                }
                else if(mediaError.code === 3){
                    message = "تعذر فك ملف الفيديو. قد يكون الملف أو الترميز غير مدعوم.";
                }
                else if(mediaError.code === 4){
                    message = "المتصفح لا يستطيع تشغيل صيغة الفيديو من هذا الخادم.";
                }
            }

            showError("فشل تحميل الفيديو", message);

            if(retryCount < 5){
                scheduleRetry();
            }
        }
    );


    video.addEventListener("loadedmetadata", function(){
        retryCount = 0;
        loading.style.display = "none";
        updateTimeDisplay();
        if(isFinite(video.duration)){
            seekBar.max = video.duration;
        }
    });

    video.addEventListener("playing", function(){
        streamStarted = true;
        retryCount = 0;
        loading.style.display = "none";
        updatePlayIcon();
    });

    video.addEventListener("progress", function(){
        if(isFinite(video.currentTime) && video.currentTime > 0){
            lastGoodTime = video.currentTime;
        }
    });

    video.addEventListener("stalled", function(){
        if(!video.paused && !video.ended){
            loading.style.display = "block";
        }
    });

    retryBtn.onclick = function(e){
        e.stopPropagation();
        startStream(true);
    };

    container.addEventListener(
        "mousemove",
        showControls
    );


    container.addEventListener(
        "touchstart",
        function(){

            if(
                centerControls.classList.contains("visible")
            ){

                hideControls();

            }
            else{

                showControls();

            }

        },
        {passive:true}
    );


    /* =====================================================
       تقديم / رجوع 10 ثواني
       ===================================================== */

    document.getElementById(
        "seek-backward-btn"
    ).onclick=function(e){

        e.stopPropagation();

        if(isFinite(video.duration)){

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 10
                );

        }

    };


    document.getElementById(
        "seek-forward-btn"
    ).onclick=function(e){

        e.stopPropagation();

        if(isFinite(video.duration)){

            video.currentTime =
                Math.min(
                    video.duration,
                    video.currentTime + 10
                );

        }

    };


    /* =====================================================
       الإعدادات
       ===================================================== */

    settingsBtn.onclick=function(e){

        e.stopPropagation();

        if(
            settingsPopup.style.display === "block"
        ){

            settingsPopup.style.display = "none";

        }
        else{

            settingsPopup.style.display = "block";

        }

    };


    document.querySelector(
        ".settings-close-btn"
    ).onclick=function(){

        settingsPopup.style.display = "none";

    };


    /* =====================================================
       رسالة الخطأ
       ===================================================== */

    function showError(title,message){

        loading.style.display = "none";

        errorTitle.textContent =
            title;

        errorMessage.textContent =
            message;

        errorOverlay.style.display =
            "flex";

        feather.replace();

    }


    /* =====================================================
       بدء التشغيل
       ===================================================== */

    updateMuteIcon();

    updatePlayIcon();

    startStream();

});
</script>

</body>
</html>
